<?xml version="1.0" encoding="UTF-8"?>
<!-- Bland Quest Auto: the walk home in the rain, and the car through the puddle. A big still in the same 1980s action-anime
     look as the kick. Flashed up in the game when the car hits the puddle; also on cutscenes.html. -->
<svg id="splash" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A wall of puddle water from a passing car hits him on the pavement in the rain">
  <style>
    .o { stroke: #1c1028; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #1c1028; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <linearGradient id="r-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5068"/><stop offset="1" stop-color="#8890a8"/></linearGradient>
    <linearGradient id="r-water" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4a7ab8"/><stop offset=".6" stop-color="#9fd0f0"/><stop offset="1" stop-color="#e8f8ff"/></linearGradient>
    <linearGradient id="r-shades" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fa8"/><stop offset=".5" stop-color="#2a1550"/><stop offset="1" stop-color="#46e0ff"/></linearGradient>
    <radialGradient id="r-vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#140a28" stop-opacity="0"/><stop offset="1" stop-color="#140a28" stop-opacity=".55"/></radialGradient>
    <filter id="r-grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer></filter>
  </defs>

  <!-- grey sky, the terrace behind, the pavement and the wet road -->
  <rect width="960" height="540" fill="url(#r-sky)"/>
  <g class="t" stroke="#2a2a3a">
    <rect x="-10" y="120" width="300" height="250" fill="#7a4a3a"/><rect x="290" y="140" width="300" height="230" fill="#8a5240"/><rect x="590" y="120" width="380" height="250" fill="#7a4a3a"/>
    <rect x="40" y="170" width="70" height="60" fill="#4a5a78"/><rect x="180" y="170" width="70" height="60" fill="#4a5a78"/>
    <rect x="340" y="190" width="70" height="60" fill="#4a5a78"/><rect x="480" y="190" width="70" height="60" fill="#4a5a78"/>
    <rect x="650" y="170" width="70" height="60" fill="#4a5a78"/><rect x="800" y="170" width="70" height="60" fill="#4a5a78"/>
  </g>
  <path class="o" fill="#8a8aa0" d="M-10,370 L970,370 L970,430 L-10,430 Z"/>
  <rect x="-10" y="430" width="980" height="12" fill="#b0b0c8" class="o"/>
  <rect x="-10" y="442" width="980" height="110" fill="#3a3a4e"/>

  <!-- the car that did it, speeding off to the right -->
  <g>
    <path class="o" fill="#d8d8d0" d="M620,470 L640,420 C650,404 670,396 700,396 L860,396 C890,396 910,410 930,440 L970,446 L970,480 L620,480 Z"/>
    <path class="o" fill="#203048" d="M670,420 C676,410 688,406 700,406 L770,406 L770,436 L666,436 Z"/>
    <path class="o" fill="#203048" d="M780,406 L850,406 C866,406 880,414 892,436 L780,436 Z"/>
    <circle cx="700" cy="484" r="30" fill="#222228" class="o"/><circle cx="700" cy="484" r="14" fill="#a8acb4" class="o"/>
    <path fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7" d="M960,410 L1000,410 M940,440 L1000,440 M950,470 L1000,470"/>
  </g>

  <!-- him, on the pavement, turned away, arms up too late -->
  <g id="r-hero">
    <path class="o" fill="#304a88" d="M300,300 C296,340 292,380 290,420 L314,422 C318,384 324,346 330,306 Z"/>
    <path class="o" fill="#4060a8" d="M336,300 C342,340 350,380 356,420 L380,418 C374,378 368,340 362,300 Z"/>
    <path class="o" fill="#5a2e14" d="M284,416 L318,418 C324,426 322,436 314,438 L278,438 C272,430 276,420 284,416 Z"/>
    <path class="o" fill="#5a2e14" d="M352,414 L386,414 C394,422 392,434 384,436 L348,436 C342,428 346,418 352,414 Z"/>
    <path class="o" fill="#8a3028" d="M290,200 C300,184 360,184 372,200 C380,240 378,280 368,310 C344,318 316,318 294,310 C284,280 284,240 290,200 Z"/>
    <path class="o" fill="#8a3028" d="M372,206 C390,180 400,150 404,120 L388,114 C380,140 368,166 352,190 Z"/>
    <path class="o" fill="#8a3028" d="M292,206 C274,180 264,150 262,120 L278,114 C284,140 294,166 310,190 Z"/>
    <rect x="384" y="96" width="26" height="26" rx="9" fill="#e8b090" class="o"/>
    <rect x="256" y="96" width="26" height="26" rx="9" fill="#e8b090" class="o"/>
    <path class="o" fill="#e8b090" d="M296,160 C296,130 312,112 332,112 C352,112 368,130 368,160 C368,184 352,198 332,198 C312,198 296,184 296,160 Z"/>
    <path class="o" fill="#402410" d="M294,154 C292,124 310,104 332,104 C356,104 372,124 370,154 C360,138 346,132 332,132 C316,132 302,138 294,154 Z"/>
    <path class="o" fill="#d8d8d8" d="M296,140 C316,128 350,128 370,140 L368,150 C350,138 316,138 298,150 Z"/>
    <path class="o" fill="url(#r-shades)" stroke-width="3" d="M308,160 C316,154 328,156 330,164 C328,172 320,174 314,172 C308,170 306,166 308,160 Z"/>
    <path class="o" fill="url(#r-shades)" stroke-width="3" d="M336,164 C340,156 352,154 358,160 C360,166 356,172 350,172 C342,174 336,170 336,164 Z"/>
    <path class="t" d="M330,164 L336,164"/>
    <path class="o" fill="#5a1a1a" d="M322,180 C328,176 340,176 344,182 C340,190 326,190 322,180 Z"/>
  </g>

  <!-- the wall of water, from the puddle under the car's wheel, up and over him -->
  <path class="o" fill="url(#r-water)" opacity=".9" d="M730,480 C660,430 590,320 550,220 C510,120 430,40 320,40 C240,40 190,90 196,160 C238,118 300,112 344,150 C388,190 404,262 436,334 C470,410 570,474 650,492 Z"/>
  <path fill="#fff" opacity=".55" d="M560,240 C520,150 450,80 360,70 C430,96 490,150 530,230 Z"/>
  <path class="o" fill="url(#r-water)" opacity=".75" d="M700,490 C600,470 500,440 420,400 C380,380 330,350 290,330 C350,330 420,350 480,380 C560,420 640,450 720,470 Z"/>
  <g fill="#e8f8ff" class="t">
    <circle cx="260" cy="80" r="14"/><circle cx="220" cy="140" r="10"/><circle cx="300" cy="30" r="9"/><circle cx="420" cy="40" r="11"/>
    <circle cx="200" cy="200" r="8"/><circle cx="470" cy="70" r="7"/><circle cx="380" cy="20" r="6"/><circle cx="240" cy="260" r="9"/>
  </g>
  <!-- the rain, slanting down over everything -->
  <g stroke="#e0ecff" stroke-width="3" stroke-linecap="round" opacity=".6">
    <path d="M60,20 L48,60 M140,80 L128,120 M210,30 L198,70 M520,40 L508,80 M600,100 L588,140 M700,20 L688,60 M800,90 L788,130 M880,30 L868,70"/>
    <path d="M100,250 L88,290 M560,240 L548,280 M760,260 L748,300 M900,230 L888,270 M30,330 L18,370 M460,300 L448,340"/>
  </g>

  <!-- the sound of it -->
  <text x="560" y="150" transform="rotate(-10 560 150)" font-family="Impact, 'Arial Black', sans-serif" font-size="104" font-style="italic" fill="#46a0ff" opacity=".9">SPLOOSH!</text>
  <text x="552" y="142" transform="rotate(-10 552 142)" font-family="Impact, 'Arial Black', sans-serif" font-size="104" font-style="italic" fill="#9fe8ff" stroke="#1c1028" stroke-width="7" paint-order="stroke">SPLOOSH!</text>

  <rect width="960" height="540" filter="url(#r-grain)"/>
  <rect width="960" height="540" fill="url(#r-vig)"/>
</svg>
