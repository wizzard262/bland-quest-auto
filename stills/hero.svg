<?xml version="1.0" encoding="UTF-8"?>
<!-- Bland Quest Auto: our hero for the title screen, holding a spanner up high like a sword. Same 1980s action-anime look as
     the stills; a clear background, so the panels show behind him. -->
<svg id="hero" viewBox="0 0 600 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Our hero, legs apart, holding a big spanner up high like a sword">
  <style>
    .o { stroke: #1c1028; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .t { stroke: #1c1028; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <linearGradient id="h-steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a909a"/><stop offset=".45" stop-color="#f4f8ff"/><stop offset="1" stop-color="#8a909a"/></linearGradient>
    <linearGradient id="h-shades" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fa8"/><stop offset=".5" stop-color="#2a1550"/><stop offset="1" stop-color="#46e0ff"/></linearGradient>
    <radialGradient id="h-glint" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- the raised arm, straight up, fist round the spanner (drawn behind his head and body) -->
  <path class="o" fill="#e04838" d="M322,476 C330,440 344,408 358,380 L394,392 C382,420 372,452 364,486 Z"/>
  <path class="o" fill="#e8b090" d="M360,388 C368,354 376,316 382,282 L414,286 C410,322 402,360 392,396 Z"/>
  <!-- the spanner, held high like a sword, catching the light -->
  <g transform="rotate(6 394 260)">
    <rect x="376" y="70" width="36" height="220" rx="9" fill="url(#h-steel)" class="o"/>
    <path class="o" fill="url(#h-steel)" d="M364,74 C350,50 356,18 378,6 L382,40 L406,40 L410,6 C432,18 438,50 424,74 Z"/>
    <path fill="#fff" opacity=".7" d="M389,82 L396,82 L396,270 L389,270 Z"/>
  </g>
  <rect x="368" y="236" width="56" height="54" rx="16" fill="#e8b090" class="o"/>
  <path class="t" d="M374,252 L418,250 M374,268 L418,268"/>
  <!-- the glint off it -->
  <g fill="#fff">
    <path d="M440,40 L448,70 L478,78 L448,86 L440,116 L432,86 L402,78 L432,70 Z"/>
    <circle cx="440" cy="78" r="44" fill="url(#h-glint)" opacity=".6"/>
  </g>

  <g transform="translate(0 150)">
  <!-- legs apart, boots planted -->
  <path class="o" fill="#4060a8" d="M226,560 C214,640 196,720 172,800 L224,808 C244,732 262,656 280,580 Z"/>
  <path class="o" fill="#304a88" d="M300,580 C320,656 348,732 372,806 L424,796 C396,716 372,640 352,560 Z"/>
  <path fill="none" stroke="#86a4e8" stroke-width="4" stroke-linecap="round" d="M236,600 C226,670 210,730 196,786 M330,600 C348,670 370,730 392,786"/>
  <path class="o" fill="#5a2e14" d="M162,796 L232,800 C240,816 238,836 226,846 L146,846 C138,830 144,806 162,796 Z"/>
  <path class="o" fill="#5a2e14" d="M366,796 L432,790 C450,800 458,824 450,840 L370,846 C358,832 356,810 366,796 Z"/>
  <!-- jeans top and belt -->
  <path class="o" fill="#4060a8" d="M216,520 L364,520 L370,590 C330,606 266,606 220,590 Z"/>
  <path class="o" fill="#2a1810" d="M214,512 L366,512 L368,536 L212,536 Z"/>
  <rect x="276" y="510" width="28" height="28" rx="3" fill="#f0c040" class="o"/>

  <!-- body: red shirt, sleeves rolled, open at the collar, chest out -->
  <path class="o" fill="#e04838" d="M200,520 C190,450 196,390 220,350 C240,320 272,308 296,308 C320,308 352,320 370,350 C392,390 394,450 380,520 Z"/>
  <path fill="#a83020" d="M206,516 C198,450 204,392 226,356 C214,400 214,460 224,516 Z"/>
  <path fill="none" stroke="#ff8a70" stroke-width="5" stroke-linecap="round" d="M318,330 C346,346 362,380 368,420"/>
  <path class="o" fill="#e8b090" d="M266,314 L296,372 L326,314 Z"/>
  <path class="t" d="M296,372 L296,500"/>
  <circle cx="296" cy="404" r="4" fill="#f4f4f0"/><circle cx="296" cy="440" r="4" fill="#f4f4f0"/><circle cx="296" cy="476" r="4" fill="#f4f4f0"/>
  <!-- the other arm: fist on his hip -->
  <path class="o" fill="#e04838" d="M222,354 C200,372 186,400 180,430 L214,440 C220,414 230,394 244,380 Z"/>
  <path class="o" fill="#e8b090" d="M182,426 C176,456 184,486 204,506 L226,488 C212,474 208,456 212,436 Z"/>
  <rect x="200" y="480" width="40" height="40" rx="14" fill="#e8b090" class="o"/>

  <!-- neck and head: square jaw, two-day beard, aviators, headband tails flying -->
  <path class="o" fill="#c88a6e" d="M272,268 L320,268 L318,322 L274,322 Z"/>
  <path class="o" fill="#f4f4f0" d="M232,176 C200,166 176,174 146,160 C168,184 196,190 228,190 Z"/>
  <path class="o" fill="#f4f4f0" d="M230,190 C204,200 182,218 152,216 C176,232 204,226 230,206 Z"/>
  <path class="o" fill="#e8b090" d="M236,190 C236,148 262,120 296,120 C330,120 356,148 356,190 C356,232 346,266 326,282 C312,292 280,292 266,282 C246,266 236,232 236,190 Z"/>
  <path fill="#603818" opacity=".35" d="M244,226 C250,262 266,284 296,288 C326,284 342,262 348,226 C336,252 318,264 296,264 C274,264 256,252 244,226 Z"/>
  <path class="o" fill="#603818" d="M232,184 C226,138 256,104 298,104 C340,104 368,138 360,184 C350,160 330,148 298,148 C266,148 244,160 232,184 Z"/>
  <path class="o" fill="#f4f4f0" d="M234,166 C262,150 334,150 360,166 L358,182 C332,166 264,166 236,182 Z"/>
  <path class="o" fill="url(#h-shades)" stroke-width="4" d="M250,196 C262,188 284,188 290,198 C288,214 278,222 264,220 C252,218 246,208 250,196 Z"/>
  <path class="o" fill="url(#h-shades)" stroke-width="4" d="M302,198 C308,188 330,188 342,196 C346,208 340,218 328,220 C314,222 304,214 302,198 Z"/>
  <path class="t" d="M290,198 L302,198"/>
  <path fill="#fff" opacity=".85" d="M256,200 L272,197 L258,212 Z M308,200 L324,197 L310,212 Z"/>
  <!-- a determined grin -->
  <path class="o" fill="#f4f4f0" stroke-width="4" d="M272,246 C286,252 306,252 320,246 L316,258 C304,262 288,262 276,258 Z"/>
  <path class="t" stroke-width="2" d="M282,248 L282,260 M296,250 L296,262 M310,248 L310,260"/>
  </g>
</svg>
